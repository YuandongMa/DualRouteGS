[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dualroutegs"
version = "0.1.0"
description = "Coordinated state and Gaussian routing for single-view transmissive reconstruction"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "numpy>=1.24,<3", "PyYAML>=6", "Pillow>=10"]

[project.optional-dependencies]
metrics = ["scipy>=1.11", "scikit-image>=0.22", "lpips>=0.1.4"]

[tool.setuptools.packages.find]
include = ["dualroutegs*"]
