_base_: paper.yaml
model:
  dim: 32
  depth: 2
  heads: 4
  patch_size: 4
  state_dim: 32
  subspaces: 4
  r_min: 1
  anchor_size: 8
  decoder_dim: 16
  initial_kappa: 0.1
  scale_min: 0.02
  scale_max: 0.30
  gradient_checkpointing: false
data:
  manifest: data/demo/manifest.json
  image_size: 16
renderer:
  backend: reference
  ray_chunk: 256
  gaussian_chunk: 256
  checkpoint: false
train:
  steps: 3
  accumulation: 1
  warmup: 0
  workers: 0
  cpu_threads: 2
  amp: false
  log_every: 1
  save_every: 3
inference:
  steps: 3
